name: Build Sekai (Paper 26.3)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Paper 26.3 Dev-Bundle + paperweight setzen
        run: |
          DB=$(curl -s https://repo.papermc.io/repository/maven-public/io/papermc/paper/dev-bundle/maven-metadata.xml | grep -o '<version>26\.3[^<]*' | sed 's/<version>//' | tail -1)
          PW=$(curl -s https://plugins.gradle.org/m2/io/papermc/paperweight/userdev/io.papermc.paperweight.userdev.gradle.plugin/maven-metadata.xml | grep -o '<latest>[^<]*' | sed 's/<latest>//')
          echo "dev-bundle=$DB paperweight=$PW" | tee versions.txt
          sed -i "s/^paper = \".*\"/paper = \"$DB\"/" gradle/libs.versions.toml
          sed -i "s/paper-userdev = { id = \"io.papermc.paperweight.userdev\", version = \"[^\"]*\"/paper-userdev = { id = \"io.papermc.paperweight.userdev\", version = \"$PW\"/" gradle/libs.versions.toml
          grep -E '^paper =|paper-userdev' gradle/libs.versions.toml
      - name: Build
        run: |
          CI=true ./gradlew build -x test --continue 2>&1 | tee build.log || true
      - name: Ergebnis in Branch build-output speichern
        if: always()
        run: |
          mkdir -p /tmp/out/jars
          cp build.log versions.txt /tmp/out/ 2>/dev/null || true
          grep -E "error:|FAILED|What went wrong|Could not" build.log | head -800 > /tmp/out/errors.txt || true
          cp plugins/*-paper/build/libs/*.jar /tmp/out/jars/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "${GITHUB_SHA}" > commit.txt
          git add -A
          git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-output
