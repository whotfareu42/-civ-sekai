debug: false

max_streak: 1
streak_delay: 20 hours
streak_grace_period: 1 day
#Needs to be a multiple of a full minute
online_for_reward: 30 minutes

give_reward_to_pearled: false
multiply_pearl_cost: false

physical: false
virtual_cap: 64

rewards:
  essence:
    v: 3839
    ==: org.bukkit.inventory.ItemStack
    type: ENDER_EYE
    amount: 1
    meta:
      meta-type: UNSPECIFIC
      ==: ItemMeta
      display-name: Player Essence
      lore:
        - Activity reward used to fuel pearls

login_reward: 4
voting_reward: 2

voting_sites:
  minecraftservers:
    name: MinecraftServers.org
    voting_url: https://minecraftservers.org/vote/696077
    internal_key: MinecraftServers.org
    voting_cooldown: 20h
  minecraftmp:
    name: Minecraft-MP.com
    voting_url: https://minecraft-mp.com/server/366770/vote/
    internal_key: Minecraft-MP.com
    voting_cooldown: 20h
  minecraftserverlist:
    name: Minecraft-Server-List.com
    voting_url: https://minecraft-server-list.com/server/524920/vote/
    internal_key: MinecraftServerList
    voting_cooldown: 20h
database:
  ==: vg.civcraft.mc.civmodcore.dao.DatabaseCredentials
  plugin: EssenceGlue
  username: __DB_USER__
  password: __DB_PASS__
  host: __DB_HOST__
  port: 3306
  database: __DB_NAME__
  poolsize: 1
  connection_timeout: 10000
  idle_timeout: 600000
  max_lifetime: 7200000
