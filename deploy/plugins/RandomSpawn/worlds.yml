# Sekai: zufälliger Spawn über die ganze Landmasse
sekai:
  randomspawnon:
    - respawn
    - firstjoin
  keeprandomspawns: false
  spawnbyplayer: false
  # Jeder Spawnpunkt (/rs addspawn) zaehlt als 1 Platz, die Wildnis als randomslots Plaetze
  randomslots: 9
  spawnarea:
    type: "square"
    x-min: -7000
    x-max: 7000
    z-min: -7000
    z-max: 13000
  spawnblacklistbiomes:
    - "minecraft:ocean"
    - "minecraft:deep_ocean"
    - "minecraft:cold_ocean"
    - "minecraft:deep_cold_ocean"
    - "minecraft:lukewarm_ocean"
    - "minecraft:deep_lukewarm_ocean"
    - "minecraft:warm_ocean"
    - "minecraft:frozen_ocean"
    - "minecraft:deep_frozen_ocean"
    - "minecraft:river"
    - "minecraft:frozen_river"

# Sekai: Spawnbereich im Nether (z. B. für ExilePearl-Gefangene). Kein automatisches Respawnen hier.
sekai_nether:
  randomspawnon: []
  keeprandomspawns: false
  spawnbyplayer: false
  spawnarea:
    type: "square"
    x-min: -800
    x-max: 800
    z-min: -800
    z-max: 1500
  spawnblacklist:
    - "WATER"
    - "LAVA"
    - "FIRE"
    - "SOUL_FIRE"
    - "CACTUS"
    - "MAGMA_BLOCK"
    - "BEDROCK"
