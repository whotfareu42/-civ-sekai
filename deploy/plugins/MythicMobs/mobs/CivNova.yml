# Civitas Nova Custom Mobs
# Drops kommen aus CivNova (config.yml -> mob-drops), erkannt am Scoreboard-Tag.
# Test: /mm mobs spawn <Name> [amount]   e.g. /mm mobs spawn Tempest

# Normaler Blaze fuer den Nether (es gibt keine Festungen). Vanilla-Verhalten und Vanilla-Drops.
NetherBlaze:
  Type: BLAZE
  Health: 20

# Breeze in deserts and on the nether islands
Tempest:
  Type: BREEZE
  Display: '&bTempest'
  Health: 60
  Skills:
  - addtag{tag=civnova_tempest} @self ~onSpawn
  # Gust: damage + knockback around it
  - effect:particles{p=cloud;a=40;hs=2;vs=1;s=0.1} @self ~onTimer:40
  - damage{a=4} @PlayersInRadius{r=4} ~onTimer:40
  - throw{velocity=6;velocityY=3} @PlayersInRadius{r=4} ~onTimer:40

# Rare boss breeze
CoreWarden:
  Type: BREEZE
  Display: '&6&lCore Warden'
  Health: 200
  Damage: 6
  Options:
    AlwaysShowName: true
    Glowing: true
    KnockbackResistance: 0.8
    MaxCombatDistance: 40
  Skills:
  - addtag{tag=civnova_corewarden} @self ~onSpawn
  - command{c="attribute <caster.uuid> minecraft:scale base set 2"} @self ~onSpawn
  - summon{type=Tempest;amount=2;radius=4;cooldown=30} @self ~onDamaged 0.25
  - effect:particles{p=explosion;a=10;hs=3;vs=1} @self ~onTimer:60
  - damage{a=7} @PlayersInRadius{r=6} ~onTimer:60
  - throw{velocity=12;velocityY=6} @PlayersInRadius{r=6} ~onTimer:100

# Storm phantom: only during thunderstorms, at the surface everywhere
Stormcaller:
  Type: PHANTOM
  Display: '&3&lStormcaller'
  Health: 150
  Damage: 8
  Options:
    AlwaysShowName: true
    PreventSunburn: true
    KnockbackResistance: 0.6
    MaxCombatDistance: 48
    FollowRange: 48
  Skills:
  - addtag{tag=civnova_stormcaller} @self ~onSpawn
  - command{c="attribute <caster.uuid> minecraft:scale base set 2.5"} @self ~onSpawn
  - effect:particles{p=electric_spark;a=30;hs=1.5;vs=0.5;s=0.2} @self ~onTimer:20
  # Dive hit lifts the player so they cannot just stand still under it
  - potion{type=LEVITATION;duration=30;level=1} @trigger ~onAttack
  # Lightning strikes on and around players in range
  - lightning{damage=5} @PlayersInRadius{r=24} ~onTimer:120 0.6
  - effect:lightning @RandomLocationsNearTargets{a=3;r=6} ~onTimer:80
