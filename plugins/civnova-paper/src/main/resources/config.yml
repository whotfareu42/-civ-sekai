discord: "https://discord.gg/3VvxepfbvA"

# Wird beim Start gesetzt (PebbleHost ueberschreibt server.properties)
max-players: 1000

# Natuerlich generierte Bloecke dieser Sorte koennen nicht abgebaut werden (auch nicht durch
# Explosionen, Kolben oder Endermen). Von Spielern gesetzte Bloecke sind normal abbaubar.
# Bypass-Recht: civnova.protected.bypass (Admin-Modus)
protected-blocks:
  enabled: true
  materials:
    - SOUL_SAND
  # In diesen Welten bleibt alles normal abbaubar
  ignored-worlds:
    - sekai_nether

# Track fuer /promote und /demote
rank-track: staff

# Normale Spieler sehen beim Tabben nur Befehle dieser Plugins
# (und nur, wenn sie die Rechte dafuer haben) plus die Befehle aus extra-commands.
# Wer civnova.tab.all hat (Helper/Mod/Admin), sieht alles.
tab-filter:
  enabled: true
  allowed-plugins:
    - NameLayer
    - Citadel
    - JukeAlert
    - Bastion
    - CivChat2
    - ExilePearl
    - FactoryMod
    - ItemExchange
    - RealisticBiomes
    - CastleGates
    - RailSwitch
    - EssenceGlue
    - CombatTagPlus
    - CivModCore
    - SimpleAdminHacks
    - BreweryX
    - EvenMoreFish
    - GSit
    - voicechat
    - CivNova
    - CivNovaSupport
  extra-commands:
    - list
    - me
    - help
    - tracker
  blocked-commands:
    - civnova

# End-Portal-Bloecke in der Oberwelt fuehren in den Nether (Koordinaten / 8) und zurueck (* 8).
# Auf der anderen Seite muss ebenfalls ein End-Portal-Feld stehen.
# enabled: false = CivMC-Verhalten (SimpleAdminHacks PortalModifyHack, Nether 1:1)
# scale 1 = Nether 1:1 (keine Abkuerzung), 8 = Vanilla-Verhaeltnis
portal-link:
  enabled: true
  scale: 1
  search: 32
  overworld: sekai
  nether: sekai_nether

# Enderaugen zeigen zum naechsten bekannten Portal (Nether- oder End-Portal-Feld)
portal-eyes:
  enabled: true
  # Portale werden automatisch gespeichert, wenn sie entzuendet oder benutzt werden.
  # Admins: /civnova portal add|remove|list

