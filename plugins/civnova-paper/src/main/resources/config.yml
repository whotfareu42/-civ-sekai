# ---------------------------------------------------------------- Angeln
# Vanilla: 85% Fisch, 10% Muell, 5% Schatz. Mit diesen Werten ca. 80% / 4% / 16%.
fishing:
  enabled: true
  junk-to-treasure: 0.6
  fish-to-treasure: 0.06
  # Sonderfaenge (Chance pro Fang)
  special:
    trim-fragment:
      chance: 0.005
      items: [trim-tricky, trim-plains, trim-relic, trim-arid, trim-forest, trim-barren]
    chorus-flower:
      chance: 0.003
      item: CHORUS_FLOWER
    dragon-head:
      chance: 0.0005
      item: DRAGON_HEAD

# ---------------------------------------------------------------- Mob-Drops
# Zusaetzliche Drops fuer Mobs mit diesem Scoreboard-Tag (MythicMobs setzt den Tag beim Spawn).
mob-drops:
  civnova_tempest:
    require-player-kill: true
    clear-vanilla-drops: true
    drops:
    - {item: BREEZE_ROD, chance: 1.0, min: 1, max: 2}
    - {item: wind-essence, chance: 0.25, min: 1, max: 1}
    - {item: HEAVY_CORE, chance: 0.02, min: 1, max: 1}
  civnova_corewarden:
    require-player-kill: true
    clear-vanilla-drops: true
    drops:
    - {item: HEAVY_CORE, chance: 1.0, min: 1, max: 1}
    - {item: BREEZE_ROD, chance: 1.0, min: 3, max: 5}
    - {item: wind-essence, chance: 1.0, min: 2, max: 2}
  civnova_stormcaller:
    require-player-kill: true
    clear-vanilla-drops: true
    drops:
    - {item: PHANTOM_MEMBRANE, chance: 1.0, min: 3, max: 6}
    - {item: wind-essence, chance: 1.0, min: 1, max: 3}
    - {item: storm-eye, chance: 0.3, min: 1, max: 1}
    - {item: netherstar-shard, chance: 0.07, min: 1, max: 2}
    - {item: HEART_OF_THE_SEA, chance: 0.05, min: 1, max: 1}
    - {item: book-feather-falling-4, chance: 0.03, min: 1, max: 1}
    - {item: book-channeling, chance: 0.03, min: 1, max: 1}
    - {item: book-loyalty-3, chance: 0.03, min: 1, max: 1}
    - {item: stormsong, chance: 0.01, min: 1, max: 1}

# ---------------------------------------------------------------- Banns
# Koennen nicht gecraftet, platziert, benutzt oder behalten werden (Bypass: civnova.banneditems.bypass)
banned-items:
- SHULKER_BOXES
- ELYTRA
- END_CRYSTAL
- RESPAWN_ANCHOR
# Diese Verzauberungen werden von Buechern entfernt (Items mit der Verzauberung bleiben erlaubt)
banned-book-enchants:
- mending
- density
- breach
- wind_burst

# ---------------------------------------------------------------- Custom Spawns
# Ersetzt einen Teil der natuerlichen Spawns. Erster Treffer gewinnt (Reihenfolge wichtig).
# entity: Vanilla-Mob  |  mythic: MythicMobs-Mob   (Test: /mm mobs spawn <Name>)
custom-spawns:
# Gewitter: Stormcaller ueberall an der Oberflaeche (vor den anderen Eintraegen, damit er Vorrang hat)
- {world: sekai, mythic: Stormcaller, chance: 0.002, outside: true, thunder: true}
# Wueste (Oberflaeche)
- {world: sekai, mythic: CoreWarden, chance: 0.0004, outside: true, biomes: [DESERT]}
- {world: sekai, mythic: Tempest, chance: 0.04, outside: true, biomes: [DESERT]}
# Nether-Inseln in der Oberwelt: erkannt am Boden-Block (Oberflaeche)
- {world: sekai, mythic: CoreWarden, chance: 0.0004, outside: true, ground: [NETHERRACK, BLACKSTONE, BASALT, SMOOTH_BASALT, CRIMSON_NYLIUM, WARPED_NYLIUM, SOUL_SAND, SOUL_SOIL, MAGMA_BLOCK]}
- {world: sekai, mythic: Tempest, chance: 0.04, outside: true, ground: [NETHERRACK, BLACKSTONE, BASALT, SMOOTH_BASALT, CRIMSON_NYLIUM, WARPED_NYLIUM, SOUL_SAND, SOUL_SOIL, MAGMA_BLOCK]}
# Blazes im ganzen Nether
- {world: sekai_nether, entity: BLAZE, chance: 0.04}
