discord: "https://discord.gg/3VvxepfbvA"

# Wird beim Start gesetzt (PebbleHost ueberschreibt server.properties)
max-players: 1000

# Track fuer /promote und /demote
rank-track: staff

# Normale Spieler sehen beim Tabben nur Befehle dieser Plugins
# (und nur, wenn sie die Rechte dafuer haben) plus die Befehle aus extra-commands.
# Wer civnova.tab.all hat (Helper/Mod/Admin), sieht alles.
tab-filter:
  enabled: true
  allowed-plugins:
    - NameLayer
    - Citadel
    - JukeAlert
    - Bastion
    - CivChat2
    - ExilePearl
    - FactoryMod
    - ItemExchange
    - RealisticBiomes
    - CastleGates
    - RailSwitch
    - EssenceGlue
    - CombatTagPlus
    - CivModCore
    - SimpleAdminHacks
    - BreweryX
    - EvenMoreFish
    - GSit
    - voicechat
    - CivNova
  extra-commands:
    - list
    - me
    - help
    - tracker
  blocked-commands:
    - civnova

# End-Portal-Bloecke in der Oberwelt fuehren in den Nether (Koordinaten / 8) und zurueck (* 8).
# Auf der anderen Seite muss ebenfalls ein End-Portal-Feld stehen.
# enabled: false = CivMC-Verhalten (SimpleAdminHacks PortalModifyHack, Nether 1:1)
portal-link:
  enabled: false
  overworld: sekai
  nether: sekai_nether

# Enderaugen zeigen zum naechsten bekannten Portal (Nether- oder End-Portal-Feld)
portal-eyes:
  enabled: true
  # Portale werden automatisch gespeichert, wenn sie entzuendet oder benutzt werden.
  # Admins: /civnova portal add|remove|list
