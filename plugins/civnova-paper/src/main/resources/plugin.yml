name: CivNova
version: ${version}
main: net.civnova.CivNovaPlugin
api-version: 1.21.3
authors: [ CivNova ]
description: Civitas Nova server tweaks (tab filter, portal-finding ender eyes, discord)
softdepend: [ EssenceGlue, LuckPerms ]
commands:
  discord:
    description: Shows the Discord link
  civnova:
    description: Civitas Nova admin command
    permission: civnova.admin
  demote:
    description: Demote a player on the staff track
    permission: civnova.promote
permissions:
  civnova.promote:
    default: op
  civnova.banneditems.bypass:
    description: Use/keep banned items (admin building)
    default: false
  civnova.protected.bypass:
    description: Break natural protected blocks (soul sand)
    default: false
  civnova.admin:
    default: op
  civnova.tab.all:
    description: See every command in tab completion
    default: op
