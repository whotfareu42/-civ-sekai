name: CivNova
version: ${version}
main: net.civnova.CivNovaPlugin
api-version: 1.21.3
authors: [ CivNova ]
description: Civitas Nova server tweaks (tab filter, portal-finding ender eyes, discord)
softdepend: [ EssenceGlue ]
commands:
  discord:
    description: Shows the Discord link
  civnova:
    description: Civitas Nova admin command
    permission: civnova.admin
permissions:
  civnova.admin:
    default: op
  civnova.tab.all:
    description: See every command in tab completion
    default: op
