# LuckPerms-Gruppen, die nur im jeweiligen Modus aktiv sind
duty-groups:
  helper: helper-duty
  moderator: moderator-duty
  admin: admin-duty

# Beim Verlassen muss immer ein Grund angegeben werden.
require-reason: true

tracker:
  # Optional: Discord-Webhook-URL, dann landen alle Eintraege auch in einem Discord-Kanal
  discord-webhook: ""
  # Diese Befehle werden NICHT geloggt (private Nachrichten / Chat)
  ignored-commands: [msg, tell, m, pm, w, whisper, r, reply, g, gc, groupc, groupchat, gchat, global, globalchat, local, localchat, exit, afk, me]
